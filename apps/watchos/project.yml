name: AgentRemoteWatch

options:
  bundleIdPrefix: dev.agentremote
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "26.0"

packages:
  AgentRemoteProtocol:
    path: ../../protocol/swift

targets:
  AgentRemoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    dependencies:
      - package: AgentRemoteProtocol
        product: AgentRemoteProtocol
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Agent Remote
        WKApplication: true
        WKWatchOnly: true
        NSLocalNetworkUsageDescription: Agent Remote connects to the Mac Agent Bridge on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentremote.watch
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        # An unsigned simulator app has no keychain entitlement, so storing the pairing
        # credential fails with errSecMissingEntitlement (-34018). Sign simulator builds ad hoc.
        CODE_SIGNING_ALLOWED[sdk=watchsimulator*]: YES
        CODE_SIGN_IDENTITY[sdk=watchsimulator*]: "-"

  AgentRemoteWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
      - path: Sources/BridgeClient.swift
      - path: Sources/DeviceIdentity.swift
      - path: Sources/SessionStore.swift
      - path: Sources/Speech.swift
    dependencies:
      - package: AgentRemoteProtocol
        product: AgentRemoteProtocol
    info:
      path: Generated/Tests-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentremote.watch.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  AgentRemoteWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: AgentRemoteWatch
    info:
      path: Generated/UITests-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentremote.watch.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: AgentRemoteWatch
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  AgentRemoteWatch:
    build:
      targets:
        AgentRemoteWatch: all
        AgentRemoteWatchTests: [test]
        AgentRemoteWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentRemoteWatchTests
        - AgentRemoteWatchUITests
